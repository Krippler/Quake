name: Docker

on:
  schedule:
    # Rebuild nightly so base-image security updates get picked up. Offset
    # from the other repos' jobs rather than sharing a minute with them.
    - cron: '20 5 * * *'
  push:
    branches: ["master", "claude/**", "fix/**", "feat/**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["master"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # write so the release-on-merge path can create a git tag
      packages: write
      id-token: write
    outputs:
      release_version: ${{ steps.detect.outputs.version }}
      is_release_merge: ${{ steps.detect.outputs.is_release_merge }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history + tags so the detect step can see whether a vX.Y.Z
          # tag already exists for the version that landed.
          fetch-depth: 0
          fetch-tags: true

      # ── Release-on-merge detection ─────────────────────────────────────────
      # A release PR flips CHANGELOG.md's top section from "[Unreleased]" to
      # "[X.Y.Z] — DATE". Detecting that here means a plain merge publishes
      # only `edge`, while a release-PR merge publishes the version pins and
      # `latest` and creates the tag and GitHub Release in the same run.
      - name: Detect release-on-merge
        id: detect
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euo pipefail
          TOP="$(awk '/^## \[/ {print; exit}' CHANGELOG.md || true)"
          echo "top: ${TOP}"
          VER="$(printf '%s' "$TOP" | sed -nE 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/p')"
          if [ -z "$VER" ]; then
            echo "Top CHANGELOG section is not a release header — skipping auto-release."
            echo "is_release_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v${VER}" >/dev/null; then
            echo "Tag v${VER} already exists — skipping auto-release."
            echo "is_release_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Release commit detected: v${VER}"
          echo "is_release_merge=true"        >> "$GITHUB_OUTPUT"
          echo "version=${VER}"               >> "$GITHUB_OUTPUT"
          echo "major=${VER%%.*}"             >> "$GITHUB_OUTPUT"
          echo "major_minor=${VER%.*}"        >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log into GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          # metadata-action lowercases this, so Krippler/Quake becomes
          # ghcr.io/krippler/quake.
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tagging policy, on top of the branch name and short sha that
          # every build gets:
          #   • push tag v1.10.0           → 1.10.0, 1.10, 1, latest
          #   • release-PR merge to master → same, plus edge
          #   • plain merge to master      → edge
          flavor: |
            latest=false
          tags: |
            # A branch or PR build matches none of the version rules below, and
            # build-push-action fails immediately when handed an empty tag
            # list. These two guarantee every build is tagged with something.
            type=ref,event=branch
            type=ref,event=pr
            # Only on the default branch. The same commit is built twice when
            # a branch is pushed and then merged, and since the version stamp
            # went in those two images differ, so both writing sha-<short>
            # left it pointing at whichever finished last. A branch build is
            # still reachable by its branch tag.
            type=sha,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=${{ steps.detect.outputs.version }},enable=${{ steps.detect.outputs.is_release_merge == 'true' }}
            type=raw,value=${{ steps.detect.outputs.major_minor }},enable=${{ steps.detect.outputs.is_release_merge == 'true' }}
            type=raw,value=${{ steps.detect.outputs.major }},enable=${{ steps.detect.outputs.is_release_merge == 'true' }}
            type=raw,value=latest,enable=${{ steps.detect.outputs.is_release_merge == 'true' }}

      # Stamped into the client and printed at startup. A release build says
      # its version; anything else says which commit it came from, so a bug
      # report can be tied to a build without guessing.
      - name: Work out the build stamp
        id: stamp
        run: |
          set -euo pipefail
          VER="${{ steps.detect.outputs.version }}"
          if [ -z "$VER" ]; then
            # No branch name here: it identifies nothing the sha does not, and
            # this project's branches have slashes in them.
            VER="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "build stamp: ${VER}"

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            QUAKE_VERSION=${{ steps.stamp.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      # A release-PR merge that published the version pins also gets stamped
      # with vX.Y.Z, so the version is marked in git history and the Release
      # below has a tag to hang off. The default GITHUB_TOKEN can push a tag
      # but will not re-trigger this workflow, which is deliberate.
      - name: Auto-create vX.Y.Z git tag
        if: steps.detect.outputs.is_release_merge == 'true'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

  # The desktop build: the engine with ALSA sound, the launcher, a menu entry
  # and install.sh, as a tarball. Built on the oldest runner there is, not the
  # latest, because a binary runs on the C library it was linked against or a
  # newer one: 22.04's asks for glibc 2.34, which Ubuntu 22.04, Debian 12,
  # Fedora 35 and every rolling distribution have. Every push builds one, kept
  # as a workflow artifact; a release attaches it.
  linux:
    name: Linux desktop build
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc libc6-dev make pkg-config binutils \
            libx11-dev libxext-dev libxrandr-dev libasound2-dev \
            libsndfile1-dev zlib1g-dev

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the tarball
        id: tarball
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: |
          set -eu
          if [ -n "$RELEASE_VERSION" ]; then
            VERSION="$RELEASE_VERSION"
          elif [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="edge-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          fi
          file=$(sh tools/build-linux-tarball.sh "$VERSION" dist | tail -n 1)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$file")" >> "$GITHUB_OUTPUT"

      # What the binary asks of the system, in the log: the newest C library
      # version it needs, and the libraries it links.
      - name: Show what it needs
        run: |
          set -eu
          tar -xzf "${{ steps.tarball.outputs.file }}" -C dist
          bin=$(ls dist/*/lib/quake/xquake)
          objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1
          objdump -p "$bin" | awk '/NEEDED/ {print $2}'
          sh -n dist/*/bin/quake
          sh -n dist/*/install.sh

      - name: Keep the tarball
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tarball.outputs.name }}
          path: ${{ steps.tarball.outputs.file }}

  # Create or update the GitHub Release from the matching CHANGELOG section,
  # for either path: a manual tag push, or a release-PR merge.
  github-release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || needs.build.outputs.is_release_merge == 'true'
    needs: [build, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch the Linux desktop build
        uses: actions/download-artifact@v4
        with:
          path: linux-dist
          merge-multiple: true

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="$RELEASE_VERSION"
            TAG="v${VERSION}"
          fi
          REPO_LC="${GITHUB_REPOSITORY,,}"

          SECTION="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md | sed "/./,\$!d")"

          {
            if [ -n "$SECTION" ]; then
              printf '%s\n' "$SECTION"
            else
              echo "Release ${TAG}."
            fi
            echo ""
            echo "### Docker image"
            echo '```bash'
            echo "docker pull ghcr.io/${REPO_LC}:${VERSION}"
            echo '```'
            echo "Also published as \`latest\`, \`${VERSION%.*}\`, and \`${VERSION%%.*}\`."
            echo ""
            echo "Game data is not included and cannot be. Mount your own Quake"
            echo "install; see README.md."
            echo ""
            echo "### Linux desktop"
            echo "To play without Docker, download \`quake-linux-x86_64-${VERSION}.tar.gz\`"
            echo "below, unpack it and run \`./install.sh\`. Its README.txt has the rest."
          } > notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --target "${GITHUB_SHA}"
          fi

          for f in linux-dist/*.tar.gz; do
            [ -f "$f" ] || continue
            gh release upload "$TAG" "$f" --clobber
          done
